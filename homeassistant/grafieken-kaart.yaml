  # ================= Lading accu =================
  - type: custom:apexcharts-card
    update_interval: 5min
    graph_span: 60h
    span:
      offset: +36h
    now:
      show: true
    header:
      show: true
      title: Lading accu
      standard_format: false
      show_states: true
      colorize_states: true
    apex_config:
      chart:
        foreColor: rgb(117, 117, 117)
        height: 180px
      legend:
        show: false
      tooltip:
        shared: true
      stroke:
        dashArray: [0, 5]
      yaxis:
        min: 0
        max: 100
        tickAmount: 2
        decimalsInFloat: 0
        labels:
          minWidth: 45
          maxWidth: 45
    series:
      - entity: sensor.huis_ems_terugblik
        extend_to: false
        name: Lading
        type: line
        color: rgb(67, 160, 71)
        stroke_width: 2
        unit: '%'
        float_precision: 0
        show:
          in_header: false
        data_generator: |
          return (entity.attributes.kwartieren || []).filter((r) => Date.parse(r.t) >= start)
            .filter((r) => r.soc_pct != null)
            .map((r) => [Date.parse(r.t), r.soc_pct]);
      - entity: sensor.huis_ems_plan
        name: Lading voorspeld
        type: line
        color: rgb(67, 160, 71)
        stroke_width: 2
        unit: '%'
        float_precision: 0
        show:
          in_header: false
        data_generator: |
          const a = entity.attributes;
          const t0 = Date.parse(a.start), stap = (a.stap_min || 15) * 60000;
          const k = hass.states['sensor.huis_ems_terugblik']?.attributes?.kwartieren || [];
          const oud = k.filter((r) => Date.parse(r.t) >= start && Date.parse(r.t) < t0)
            .map((r) => [Date.parse(r.t), r.etmaal_soc_pct ?? null]);
          return oud.concat((a.soc_pct || []).map((v, i) => [t0 + i * stap, v]));
      - entity: sensor.huis_ems_accu_lading
        name: Nu
        color: rgb(67, 160, 71)
        float_precision: 0
        show:
          in_chart: false
