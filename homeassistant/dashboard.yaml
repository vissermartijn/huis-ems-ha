# Dashboard voor Huis EMS. Maak een nieuw dashboard, open de YAML-editor en plak dit erin.
# De overzichtskaart (custom:huis-ems-card) zit in de integratie; er is geen HACS voor nodig.
title: Energievoorspelling
views:
  - title: Overzicht
    path: overzicht
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:huis-ems-card
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Onderdelen
            icon: mdi:format-list-bulleted
          - type: markdown
            grid_options:
              columns: full
            content: |
              {% set delen = state_attr('sensor.huis_ems_plan', 'onderdelen_24u_kwh') %}
              {% set q = state_attr('sensor.huis_ems_voorspelkwaliteit', 'onderdelen') or {} %}
              {% set nu = state_attr('sensor.huis_ems_verbruik_dit_kwartier', 'onderdelen') or {} %}
              {% if delen %}
              | Onderdeel | Nu | Komende 24 uur | Afwijking (etmaal vooraf) |
              |---|---|---|---|
              {% for naam, kwh in delen.items() -%}
              | {{ naam }} | {{ (nu[naam] ~ ' W') if nu[naam] is defined else '-' }} | {{ kwh }} kWh | {{ (q[naam].etmaal_vooraf_w ~ ' W') if q[naam] is defined and q[naam].etmaal_vooraf_w is not none else '-' }} |
              {% endfor %}
              {% else %}Nog geen vooruitblik.{% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Apparaten
            icon: mdi:washing-machine
          - type: markdown
            grid_options:
              columns: full
            content: |
              {% set app = state_attr('sensor.huis_ems_verbruiksmodel', 'apparaten') %}
              {% set nu = state_attr('sensor.huis_ems_vooruitblik', 'apparaten') or {} %}
              {% if app %}
              | Apparaat | Nu | Per week | Meestal rond | Per keer |
              |---|---|---|---|---|
              {% for naam, a in app.items() -%}
              | {{ naam }} | {{ nu[naam] | default('-') }} | {{ a.keer_per_week }}× | {{ a.meestal_rond | join(', ') }} | {{ a.kwh_per_keer }} kWh, {{ a.duur_min }} min{{ ' (standaard)' if a.verbruik_geleerd_van == 0 }} |
              {% endfor %}
              {% else %}Nog geen apparaten of tapwater ingesteld.{% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Accu en net
            icon: mdi:home-battery
          - type: tile
            entity: sensor.huis_ems_accu_lading
            name: Lading
          - type: tile
            entity: sensor.huis_ems_accu_vermogen
            name: Accu
          - type: tile
            entity: sensor.huis_ems_net_met_accu
            name: Net
          - type: tile
            entity: sensor.huis_ems_net_zonder_accu
            name: Zonder accu
          - type: tile
            entity: number.huis_ems_zonvoorspelling_factor
            name: Zonfactor

      - type: grid
        cards:
          - type: heading
            heading: Voorspelling
            icon: mdi:bullseye-arrow
          - type: tile
            entity: sensor.huis_ems_voorspelkwaliteit
            name: Afwijking etmaal vooraf
          - type: tile
            entity: sensor.huis_ems_verbruiksmodel
            name: Model
          - type: markdown
            grid_options:
              columns: full
            content: |
              {% set q = states.sensor.huis_ems_voorspelkwaliteit.attributes %}
              {% if q.kwartieren %}
              Afgelopen {{ q.dagen }} dagen ({{ q.kwartieren }} kwartieren): verbruik gemiddeld {{ q.verbruik_afwijking_w }} W per kwartier ernaast vlak vooraf{% if q.verbruik_etmaal_vooraf_afwijking_w is not none %} en {{ q.verbruik_etmaal_vooraf_afwijking_w }} W een etmaal vooraf{% endif %}{% if q.verbruik_verschil_pct is defined %}, in totaal {{ q.verbruik_verschil_pct }}% {{ 'te hoog' if q.verbruik_verschil_pct > 0 else 'te laag' }} geschat{% endif %}.{% if q.zon_werkelijk_gedeeld_door_verwacht is defined %} Zon: werkelijk {{ (q.zon_werkelijk_gedeeld_door_verwacht * 100) | round(0) }}% van de verwachting.{% endif %}
              {% else %}Nog geen vergelijking; die bouwt per kwartier op (zonder kWh-tellers van de zonnepanelen is het werkelijke verbruik niet te bepalen).{% endif %}

              {{ state_attr('sensor.huis_ems_verbruiksmodel', 'toelichting') }}
              {% set plan_ms = state_attr('sensor.huis_ems_verbruiksmodel', 'rekentijd_plan_ms') %}{% if plan_ms is not none %}

              Rekentijd: vooruitblik {{ plan_ms }} ms per kwartier, leren {{ state_attr('sensor.huis_ems_verbruiksmodel', 'rekentijd_leren_ms') or '-' }} ms per keer, {{ state_attr('sensor.huis_ems_verbruiksmodel', 'rekentijd_per_meting_ms') or '-' }} ms per meting.{% endif %}

  - title: Per uur
    path: per-uur
    icon: mdi:table-clock
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Komende 24 uur
            icon: mdi:crystal-ball
          - type: markdown
            grid_options:
              columns: full
            content: |
              {% set a = states.sensor.huis_ems_plan.attributes %}
              {% if a.zon_w %}
              {% set t0 = as_datetime(a.start) %}
              {% set dagen = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'] %}
              {% set delen = a.onderdelen_w or {} %}
              {{ states('sensor.huis_ems_vooruitblik') }}

              | Uur | Zon | Verbruik | {% for naam in delen %}{{ naam }} | {% endfor %}Accu | Net | Lading |
              |---|---|---|{% for naam in delen %}---|{% endfor %}---|---|---|
              {% for h in range([24, (a.zon_w | count) // 4] | min) -%}
              {% set s = h * 4 -%}
              {% set t = (t0 + timedelta(minutes=15 * s)) | as_local -%}
              | {{ dagen[t.weekday()] }} {{ t.strftime('%H:%M') }} | {{ (a.zon_w[s:s+4] | sum / 4) | round(0) }} W | {{ (a.verbruik_w[s:s+4] | sum / 4) | round(0) }} W | {% for naam, w in delen.items() %}{{ (w[s:s+4] | sum / 4) | round(0) }} W | {% endfor %}{{ (a.accu_w[s:s+4] | sum / 4) | round(0) }} W | {{ (a.net_w[s:s+4] | sum / 4) | round(0) }} W | {{ a.soc_pct[s+3] ~ '%' if a.soc_pct else '-' }} |
              {% endfor %}
              {% else %}Nog geen vooruitblik.{% endif %}

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Afgelopen 24 uur, voorspeld tegenover gemeten
            icon: mdi:history
          - type: markdown
            grid_options:
              columns: full
            content: |
              {% set k = state_attr('sensor.huis_ems_terugblik', 'kwartieren') %}
              {% if k %}
              {% set dagen = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'] %}
              | Kwartier | Verbruik etmaal vooraf / vlak vooraf / gemeten | Zon etmaal vooraf / vlak vooraf / gemeten | Lading |
              |---|---|---|---|
              {% for r in k[-96:] | reverse -%}
              {% set t = as_datetime(r.t) | as_local -%}
              | {{ dagen[t.weekday()] }} {{ t.strftime('%H:%M') }} | {{ r.etmaal_verbruik_w if r.etmaal_verbruik_w is not none else '-' }} / {{ r.verwacht_verbruik_w }} / {{ r.werkelijk_verbruik_w | default('-') }} W | {{ r.etmaal_zon_w if r.etmaal_zon_w is not none else '-' }} / {{ r.verwacht_zon_w }} / {{ r.werkelijk_zon_w | default('-') }} W | {{ r.soc_pct ~ '%' if r.soc_pct is not none else '-' }} |
              {% endfor %}
              {% else %}Nog geen historie; die bouwt per kwartier op.{% endif %}
