default_config:
# Alleen voor deze wegwerpomgeving: zonder inloggen binnenkomen, om het dashboard te bekijken.
homeassistant:
  time_zone: Europe/Amsterdam
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 0.0.0.0/0
      allow_bypass_login: true
    - type: homeassistant
lovelace:
  # apexcharts-card alleen als ha_test.sh hem met APEX_JS meekrijgt (anders een lege bron).
  resource_mode: yaml
  resources:
    - url: /local/apexcharts-card.js
      type: module
  dashboards:
    ems-grafieken:
      mode: yaml
      title: Energie grafieken
      icon: mdi:chart-areaspline
      show_in_sidebar: true
      filename: ems_grafieken.yaml
    ems-kaart:
      mode: yaml
      title: Energie kaart
      icon: mdi:chart-box
      show_in_sidebar: true
      filename: ems_kaart.yaml
    ems-test:
      mode: yaml
      title: Energievoorspelling
      icon: mdi:home-lightning-bolt
      show_in_sidebar: true
      filename: ems_dashboard.yaml
logger:
  default: warning
  logs:
    custom_components.huis_ems: debug
input_number:
  p1:
    min: -6000
    max: 9000
    step: 10
    initial: 600
  nep_soc:
    min: 0
    max: 100
    initial: 60
  hottub_doel:
    min: 20
    max: 40
    initial: 37
  hottub_temp:
    min: 0
    max: 40
    initial: 37
  vaat_klaar_min:
    min: 0
    max: 600
    initial: 240
input_select:
  vaatwasser:
    options: [inactive, ready, delayedstart, run, pause, finished]
    initial: ready
input_boolean:
  tapwater:
template:
  - sensor:
      - name: P1 vermogen
        unique_id: test_p1
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ states('input_number.p1') | float(0) }}"
      - name: Vaatwasser bedrijfstoestand
        unique_id: test_vaat_state
        device_class: enum
        state: "{{ states('input_select.vaatwasser') }}"
      - name: Vaatwasser klaar
        unique_id: test_vaat_finish
        device_class: timestamp
        availability: "{{ states('input_select.vaatwasser') in ['delayedstart', 'run', 'pause', 'finished'] }}"
        state: "{{ (now() + timedelta(minutes=states('input_number.vaat_klaar_min') | int(0))).isoformat() }}"
      - name: Nep accu lading
        unique_id: test_soc
        unit_of_measurement: "%"
        device_class: battery
        state: "{{ states('input_number.nep_soc') | float(0) }}"
      - name: Teruglevering
        unique_id: test_exp
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: "1000"
      - name: Warmtepomp energie
        unique_id: test_hp
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: "7000"
      - name: Hottub energie
        unique_id: test_tub
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: "3000"
      - name: Hottub temperatuur
        unique_id: test_tub_temp
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ states('input_number.hottub_temp') | float(37) }}"
      - name: Buitentemperatuur
        unique_id: test_temp
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "9"
      - name: Afname T1
        unique_id: test_imp
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: "1234.5"
      - name: Zon opgewekt
        unique_id: test_pv_energy
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: "{{ (5000 + (now().timestamp() / 3600) % 100) | round(3) }}"
      - name: Oude zonneteller
        unique_id: test_pv_old
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ false }}"
        state: "0"
      - name: Testzon
        unique_id: test_pv
        unit_of_measurement: kW
        state: "0"
        attributes:
          forecast: >
            {% set ns = namespace(items=[]) %}
            {% set t0 = today_at('00:00') %}
            {% for h in range(48) %}
              {% set x = (h % 24 - 8) / 8 %}
              {% set ns.items = ns.items + [{'period_start': (t0 + timedelta(hours=h)).isoformat(), 'pv_estimate': (3.5 * sin(pi * x) if 0 < x < 1 else 0) | round(2)}] %}
            {% endfor %}
            {{ ns.items }}
  - binary_sensor:
      - name: Tapwater bezig
        unique_id: test_dhw
        state: "{{ is_state('input_boolean.tapwater', 'on') }}"
